<!-- welcome.component.html -->
<section class="welcome-page" role="region" aria-label="Landing parfums">
    <div class="content">
      <header class="brand">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

        <div class="brand__logo" aria-hidden="true">
          <img src="modesty.png" alt="Nom de ta marque" />
        </div>
      </header>

  
      <h1 class="hero__title">
        Découvrez <span class="hero__title--accent">votre parfum signature</span>
      </h1>
  
      <p class="hero__subtitle">
        Une expérience olfactive unique, créée par notre système intelligent, pour révéler votre essence personnelle.
      </p>
  
      <div class="actions">
        <button class="cta" (click)="onStart()" aria-label="Commencer l'expérience">
          Commencer l'expérience
        </button>
  
        <div class="lang" role="tablist" aria-label="Choisir la langue">

          <div class="lang__item" [class.active]="lang==='fr'" (click)="setLang('fr')" role="tab">
            <div class="lang__circle">
              <img src="fr.png" alt="Français" class="lang__flag" />
            </div>
            <span class="lang__label">FR</span>
          </div>

          <div class="lang__item" [class.active]="lang==='en'" (click)="setLang('en')" role="tab">
            <div class="lang__circle">
              <img src="en.png" alt="Anglais" class="lang__flag" />
            </div>
            <span class="lang__label">EN</span>
          </div>

          <div class="lang__item" [class.active]="lang==='nl'" (click)="setLang('nl')" role="tab">
            <div class="lang__circle">
              <img src="nl.png" alt="Pays-Bas" class="lang__flag" />
            </div>
            <span class="lang__label">NL</span>
          </div>

        </div>
      </div>
    </div>
  
   <aside class="visual" aria-hidden="false">
    <video
      autoplay 
      muted 
      loop 
      playsinline 
      class="visual__video">
      <source src="ub1.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo.
    </video>
      <div class="visual__overlay"></div>
  </aside>
  </section>
